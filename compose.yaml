services:
  handoff:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      HANDOFF_HTTP_TOKEN: ${HANDOFF_HTTP_TOKEN:?Set a generated workspace token}
      HANDOFF_ACCOUNTS: ${HANDOFF_ACCOUNTS:-{}}
      HANDOFF_HTTP_HOSTS: ${HANDOFF_HTTP_HOSTS:-localhost:8000,127.0.0.1:8000}
      DATABASE_URL: ${DATABASE_URL:-}
      HANDOFF_NATIVE_OAUTH: ${HANDOFF_NATIVE_OAUTH:-false}
      HANDOFF_PUBLIC_URL: ${HANDOFF_PUBLIC_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      HANDOFF_GOOGLE_WORKSPACES: ${HANDOFF_GOOGLE_WORKSPACES:-{}}
      HANDOFF_GPT_BACKEND: ${HANDOFF_GPT_BACKEND:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    volumes:
      - handoff-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
volumes:
  handoff-data:
