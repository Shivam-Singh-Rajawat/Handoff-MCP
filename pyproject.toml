[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-handoff"
version = "0.2.0"
description = "Shared-project GPT, Gemini, and Claude collaboration over MCP"
requires-python = ">=3.11"
dependencies = ["mcp==1.29.0", "httpx==0.28.1", "pypdf==6.21.4", "PyJWT[crypto]>=2.10,<3"]

[project.scripts]
handoff = "handoff.cli:main"

[tool.setuptools.packages.find]
include = ["handoff*"]

[tool.setuptools.package-data]
handoff = ["static/*"]
